name: Build and publish latest EXE

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: publish-latest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish single EXE
        shell: pwsh
        run: dotnet publish src/KlasikaPCSetup/KlasikaPCSetup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Create or update latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest --target $env:GITHUB_SHA --title "Klasika PC Setup - latest" --notes "Samodejno izdelana najnovejsa razlicica za Windows 10/11 x64."
          }
          gh release upload latest publish/Klasika-PC-Setup.exe --clobber
